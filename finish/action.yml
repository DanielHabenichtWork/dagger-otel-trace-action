name: "Publish Dagger trace"
description: >
  Stop the collector, bundle the captured telemetry into a single
  self-contained HTML viewer, upload it as a non-zipped artifact (opens
  directly in the browser), and optionally upsert a PR comment linking it.
  Pair with the `start` action. Run with `if: always()` so the trace is
  produced even when the checks failed.

inputs:
  data-dir:
    description: "Directory the collector wrote to (must match the start action). Defaults to $RUNNER_TEMP/dagger-otel."
    required: false
    default: ""
  title:
    description: "Title shown in the viewer header."
    required: false
    default: "dagger trace"
  artifact-name:
    description: "Artifact name and downloaded file name (should end in .html)."
    required: false
    default: "dagger-trace.html"
  retention-days:
    description: "Artifact retention in days."
    required: false
    default: "14"
  comment:
    description: "Upsert a PR comment linking the trace (only on pull_request events)."
    required: false
    default: "true"
  github-token:
    description: "Token used to upsert the PR comment; needs pull-requests: write."
    required: false
    default: ${{ github.token }}

outputs:
  artifact-url:
    description: "Download URL of the uploaded trace artifact (requires GitHub auth)."
    value: ${{ steps.upload.outputs.artifact-url }}

runs:
  using: composite
  steps:
    - id: bundle
      shell: bash
      run: |
        data_dir="${{ inputs.data-dir }}"
        data_dir="${data_dir:-$RUNNER_TEMP/dagger-otel}"
        out="$RUNNER_TEMP/${{ inputs.artifact-name }}"
        jq -n \
          --arg title "${{ inputs.title }}" \
          --arg repo "$GITHUB_REPOSITORY" \
          --arg ref "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" \
          --arg sha "$GITHUB_SHA" \
          --arg date "$(date -u +%FT%TZ)" \
          --arg runUrl "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
          '$ARGS.named' > "$data_dir/meta.json"
        "$GITHUB_ACTION_PATH/../scripts/finish.sh" "$data_dir" "$out" "$data_dir/meta.json"
        echo "output=$out" >> "$GITHUB_OUTPUT"
        echo "data-dir=$data_dir" >> "$GITHUB_OUTPUT"
        # Hand the sibling scripts/ dir to the summarize step below. GITHUB_ACTION_PATH
        # points at this composite action here, but a nested `uses:` step gets its
        # own action path, so it can't resolve ../scripts itself.
        echo "scripts-dir=$(cd "$GITHUB_ACTION_PATH/../scripts" && pwd)" >> "$GITHUB_OUTPUT"

    # Agent-friendly text summary — slowest steps, failing steps with
    # line-numbered logs, the span tree (what `dagger-trace --format agent`
    # prints locally). summarize.mjs is dependency-free Node; run it with the
    # runner's own Node — the interpreter already executing this JS step
    # (process.execPath) — so it works on self-hosted runners with no Node on
    # PATH, without Docker or setup-node. Never fails the build.
    - id: summarize
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        DATA_DIR: ${{ steps.bundle.outputs.data-dir }}
        SCRIPTS_DIR: ${{ steps.bundle.outputs.scripts-dir }}
        TITLE: ${{ inputs.title }}
      with:
        script: |
          const { execFileSync } = require('child_process');
          const path = require('path');
          const fs = require('fs');
          const dataDir = process.env.DATA_DIR;
          const out = path.join(dataDir, 'dagger-trace-summary.md');
          try {
            const text = execFileSync(
              process.execPath,
              [path.join(process.env.SCRIPTS_DIR, 'summarize.mjs'), dataDir,
               '--title', process.env.TITLE || 'dagger trace'],
              { encoding: 'utf8', maxBuffer: 64 * 1024 * 1024 },
            );
            if (text && text.trim()) {
              fs.writeFileSync(out, text);
              core.setOutput('summary', out);
            }
          } catch (e) {
            core.warning(`dagger trace summary skipped: ${e.message}`);
          }

    # archive: false uploads the single HTML as-is (no zip); the download is the
    # file itself, served text/html + inline so it renders in the browser.
    - id: upload
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        path: ${{ steps.bundle.outputs.output }}
        archive: false
        overwrite: true
        retention-days: ${{ inputs.retention-days }}

    # Second artifact: the raw collector capture + the text summary. Agents can
    # `gh run download` this and drill into any step with
    # `dagger-trace report --grep … --full <dir>` — no HTML blob to parse.
    - id: upload-raw
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}-raw
        path: |
          ${{ steps.bundle.outputs.data-dir }}/traces.jsonl
          ${{ steps.bundle.outputs.data-dir }}/logs.jsonl
          ${{ steps.summarize.outputs.summary }}
        if-no-files-found: ignore
        overwrite: true
        retention-days: ${{ inputs.retention-days }}

    # Link the artifact from the run's job summary (every run), and upsert a
    # single marker-keyed PR comment (pull_request events only).
    - if: ${{ steps.upload.outputs.artifact-url }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        RAW_ARTIFACT_URL: ${{ steps.upload-raw.outputs.artifact-url }}
        RAW_ARTIFACT_NAME: ${{ inputs.artifact-name }}-raw
        SUMMARY_FILE: ${{ steps.summarize.outputs.summary }}
        WANT_COMMENT: ${{ inputs.comment }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          const url = process.env.ARTIFACT_URL;
          const line = `### 📊 [View the Dagger trace](${url})`;

          // How to get the raw traces/logs and drill into a step. The raw
          // artifact holds traces.jsonl + logs.jsonl + the summary; `gh run
          // download` fetches it, then `dagger-trace report` re-analyzes it
          // offline. `gh` needs no run id — it defaults to the current run.
          const rawUrl = process.env.RAW_ARTIFACT_URL;
          const rawName = process.env.RAW_ARTIFACT_NAME;
          const runId = context.runId;
          const howto = rawUrl
            ? [
                '',
                `Raw traces + logs: [\`${rawName}\`](${rawUrl}) — download and drill into a step offline:`,
                '',
                '```sh',
                `gh run download ${runId} -n ${rawName} -D dagger-trace`,
                `npx dagger-trace report --grep '<step>' --full dagger-trace`,
                '```',
              ].join('\n')
            : '';

          // Embed the compact agent summary inline, behind a <details> so humans
          // see just the link while agents (and anyone reading the raw markdown)
          // get "what's slow / what failed" with no download. Capped so a huge
          // run can't blow the ~1 MiB summary/comment limits — the full text is
          // always in the `-raw` artifact.
          const CAP = 50_000;
          let details = '';
          const f = process.env.SUMMARY_FILE;
          if (f && fs.existsSync(f)) {
            let text = fs.readFileSync(f, 'utf8').trimEnd();
            if (text) {
              if (text.length > CAP) {
                text = text.slice(0, CAP) +
                  '\n… (truncated — full summary in the -raw artifact)';
              }
              // 4-backtick fence so the summary's own text can't close it early.
              details = `\n<details><summary>Trace summary (for agents / triage)` +
                `</summary>\n\n\`\`\`\`\n${text}\n\`\`\`\`\n${howto}\n\n</details>\n`;
            }
          }
          const block = `${line}\n${details}`;

          // Job summary — shown on the run's Summary page for every run.
          await core.summary.addRaw(block + '\n').write();

          // PR comment — upsert a single marker-keyed comment (PRs only).
          if (process.env.WANT_COMMENT === 'true' && context.eventName === 'pull_request') {
            const marker = '<!-- dagger-trace-viewer -->';
            const body = `${marker}\n${block}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
          }
