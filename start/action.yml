name: "Start Dagger trace collector"
description: >
  Start an OTLP collector sidecar that captures Dagger's OpenTelemetry stream
  (spans + per-step stdout/stderr) to files, and export the
  OTEL_EXPORTER_OTLP_* variables so subsequent `dagger` steps send telemetry to
  it. Pair with the `finish` action after your dagger steps. Requires Docker on
  the runner.

inputs:
  data-dir:
    description: >
      Directory the collector writes traces.jsonl / logs.jsonl to. Defaults to
      $RUNNER_TEMP/dagger-otel; pass the SAME value to the finish action.
    required: false
    default: ""
  collector-image:
    description: >
      Override the pinned otel/opentelemetry-collector-contrib image
      (digest-pinned by default).
    required: false
    default: ""

runs:
  using: composite
  steps:
    - shell: bash
      env:
        COLLECTOR_IMAGE: ${{ inputs.collector-image }}
      run: |
        data_dir="${{ inputs.data-dir }}"
        data_dir="${data_dir:-$RUNNER_TEMP/dagger-otel}"
        "$GITHUB_ACTION_PATH/../scripts/start.sh" "$data_dir"
